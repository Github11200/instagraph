[project]
name = "instagraph"
version = "0.1.0"
description = "Crawl your Instagram followers/following network locally and explore it as an interactive graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[http2]>=0.27",
    "python-dotenv>=1.0",
    "playwright>=1.47",
]

[project.scripts]
instagraph = "instagraph.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instagraph"]
